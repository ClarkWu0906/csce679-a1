<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hong Kong Temperature Heatmap</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Hong Kong Monthly Temperature</h1>
    <div class="mode-toggle" role="group" aria-label="Color encodes">
      <span>Color shows:</span>
      <button class="mode-button" data-mode="max">Monthly max</button>
      <button class="mode-button" data-mode="min">Monthly min</button>
    </div>
    <p class="hint">Hover a cell for details. Click any cell (or the buttons) to switch between max and min.</p>
  </header>

  <section>
    <h2>Level 1 — Year / Month Heatmap</h2>
    <div id="level1-chart" class="chart"></div>
  </section>

  <section>
    <h2>Level 2 — Daily Temperature, Last 10 Years</h2>
    <div id="level2-chart" class="chart"></div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
